description = ""
license = "MIT"
name = "learn2rag"
requires-python = "==3.13.5"
version = "1.0.0.dev0"
[project.urls]
Homepage = "https://learn2rag.de/"
Documentation = "https://docs.learn2rag.de/"
Repository = "https://github.com/Learn2RAG/configurator.git"
Issues = "https://github.com/Learn2RAG/configurator/issues"
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 77.0.3"]
[tool.mypy]
files = "learn2rag"
exclude = ["^learn2rag/pipeline/scripts/",
    "^learn2rag/pipeline/debug\\.py$",
    "^learn2rag/optimization/contrastive_optimization.py",
"generate_contrastive_answers.py",
"self_judge_optimization.py",
"tool_read_data_set.py"]
strict = true
[[tool.mypy.overrides]]
module = [
    "datasets",
    "datasets.*",
]
ignore_missing_imports = true
follow_imports = "skip"
[[tool.mypy.overrides]]
module = ["learn2rag.pipeline.debug"]
ignore_errors = true
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
strict = true
testpaths = "learn2rag"
[tool.setuptools]
include-package-data = true
[tool.setuptools.package-data]
"*" = ["**/*"]
[tool.setuptools.packages.find]
include = ["learn2rag*"]
namespaces = false
where = ["."]
[dependency-groups]
dev = [
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)",
    "yamllint>=1.38.0",
]
