<footer class="footer gradient-header py-4">
  {% if ai_notice %}
  <div class="container mb-3">
    <div class="ai-notice d-flex align-items-start" role="note" aria-label="{{ ai_notice.title }}">
      <i class="fa-solid fa-robot me-2 mt-1" aria-hidden="true"></i>
      <div>
        <strong>{{ ai_notice.title }}:</strong>
        {{ ai_notice.interaction }}
        {{ ai_notice.content }}
      </div>
    </div>
  </div>
  {% endif %}
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
    <div class="d-flex flex-column align-items-start">
      <div>
        {% if vc_commit_id %}<abbr title="{{ vc_commit_id }}">{% endif %}
          {% if learn2rag_package_version %}
          Learn2RAG {{ learn2rag_package_version }}
          {% elif vc_commit_id %}
          Learn2RAG
          {% endif %}
        {% if vc_commit_id %}</abbr>{% endif %}
      </div>
    </div>

    <div class="mt-3 mt-md-0">
      <a href="https://www.bmftr.bund.de/" target="_blank">
        <img src="{{ url_for('learn2rag_bootstrap_static', path='images/BMFTR.png') }}" alt="BMFTR Logo" style="height: 120px;" />
      </a>
    </div>
  </div>
</footer>
