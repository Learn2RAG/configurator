---
SUGGESTED_MODELS:
  gpt_oss_20b:
    label: OpenAI GPT-OSS (20B)
    description: |
      Download size: ~14GB
    link: https://ollama.com/library/gpt-oss:20b
    ollama: pull
    config:
      api: ChatOllama
      model: gpt-oss:20b
  gemma4_31b:
    label: Google Gemma 4 (31B)
    description: |
      Download size: ~20GB
    link: https://ollama.com/library/gemma4
    ollama: pull
    config:
      api: ChatOllama
      model: gemma4:31b
      reasoning: false
  qwen3_5_4b:
    label: Alibaba Qwen 3.5 (4B)
    description: |
      Download size: ~4GB
    link: https://ollama.com/library/qwen3.5
    ollama: pull
    config:
      api: ChatOllama
      model: qwen3.5:4b
      reasoning: false
      num_ctx: 65536
  gemma3n_e2b:
    label: Google Gemma 3n (E2B)
    description: |
      Download size: ~8GB
      A very small model to try things out. Do not expect good results from it!
    link: https://ollama.com/library/gemma3n
    ollama: pull
    config:
      api: ChatOllama
      model: gemma3n:e2b
      num_ctx: 16384
