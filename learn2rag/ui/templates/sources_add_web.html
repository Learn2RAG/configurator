<form method="POST">
  <input type="hidden" name="type" value="web"/>
  <div class="mb-3">
    <div class="alert alert-warning">
      {{gettext('This data source type does not support access control. All users will be provided access to all data.')}}
    </div>
  </div>
  <div class="mb-3">
    <label for="label" class="form-label">{{pgettext('form_label', 'Label')}}</label>
    <input required="required" class="form-control" name="label" title="{{pgettext('tooltip', 'A custom display name for this data source')}}">
  </div>
  <div class="mb-3">
    <input type="hidden" name="type" value="web"/>
    <label for="url" class="form-label">{{pgettext('form_label', 'Web page URL')}}</label>
    <input type="url" class="form-control" name="url" required="required" title="{{pgettext('tooltip', 'For example: https://learn2rag.de/')}}">
  </div>
  <div class="mb-3">
    <label for="depth" class="form-label">{{pgettext('form_label', 'Crawl depth')}}</label>
    <input type="number" min="-1" step="1" class="form-control" name="depth" placeholder="-1" title="{{pgettext('tooltip', 'How many levels of links to follow from the URL: 0 loads only this page, -1 crawls the whole site under this URL')}}">
  </div>
  <div class="mb-3">
    <label for="failure_threshold" class="form-label">{{ pgettext('form_label', 'Failure threshold') }}</label>
    <input type="number" min="1" step="1" class="form-control" name="failure_threshold" value="5">
  </div>
  <button type="submit" class="btn btn-primary">{{pgettext('button', 'Save')}}</button>
</form>
