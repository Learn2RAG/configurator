<form method="POST">
  <input type="hidden" name="type" value="jira"/>
  <div class="mb-3">
    <label for="label" class="form-label">{{pgettext('form_label', 'Label')}}</label>
    <input required="required" class="form-control" name="label" title="{{pgettext('tooltip', 'A custom display name for this data source')}}">
  </div>
  <div class="mb-3">
    <label for="auth_type" class="form-label">{{pgettext('form_label', 'Authentication')}}</label>
    <select required="required" class="form-select" name="auth_type">
      <option value="basic">{{pgettext('form_auth_option', 'Username and password')}}</option>
      <option value="token">{{pgettext('form_auth_option', 'Access token')}}</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="path" class="form-label">{{pgettext('form_label', 'Username')}}</label>
    <input class="form-control" name="username"/>
  </div>
  <div class="mb-3">
    <label for="path" class="form-label">{{pgettext('form_label', 'Password')}}</label>
    <input type="password" class="form-control" name="password"/>
    <div class="alert alert-warning">
      {{gettext('This password would be saved in plain text in the configuration.')}}
    </div>
  </div>
  <div class="mb-3">
    <label for="token" class="form-label">{{pgettext('form_label', 'Access token')}}</label>
    <input class="form-control" name="token"/>
  </div>
  <div class="mb-3">
    <label for="path" class="form-label">{{ pgettext('form_label', 'Base URL') }}</label>
    <input class="form-control" name="base_url" required="required"/>
  </div>
  <div class="mb-3">
    <label for="projects" class="form-label">{{ pgettext('form_label:jira', 'Projects') }}</label>
    <input class="form-control" name="projects" placeholder="TEAM1,TEAM2"/>
  </div>
  <div class="mb-3">
    <label for="issue_types" class="form-label">{{ pgettext('form_label:jira', 'Issue types') }}</label>
    <input class="form-control" name="issue_types" placeholder="Task,Story,Bug"/>
  </div>
  <input type="hidden" name="include_comments" value="no"/>
  <div class="mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="yes" id="include_comments" name="include_comments" checked>
      <label class="form-check-label" for="include_comments">
        {{ pgettext('form_label:jira', 'Include comments') }}
      </label>
    </div>
  </div>
  <div class="mb-3">
    <label for="path" class="form-label">{{ pgettext('form_label:jira', 'Page size') }}</label>
    <input class="form-control" name="page_size" type="number" placeholder="50"/>
  </div>
  <div class="mb-3">
    <label for="path" class="form-label"><code>jql</code></label>
    <input class="form-control" name="jql"/>
  </div>
  <div class="mb-3">
    <label for="failure_threshold" class="form-label">{{ pgettext('form_label', 'Failure threshold') }}</label>
    <input type="number" min="1" step="1" class="form-control" name="failure_threshold" value="5">
  </div>
  <button type="submit" class="btn btn-primary">{{pgettext('button', 'Save')}}</button>
</form>
