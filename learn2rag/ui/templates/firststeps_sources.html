<div class="alert alert-secondary" role="alert">
  <h4 class="alert-heading">{{ pgettext('firststep', 'You do not have any data sources selected') }}</h4>
  <p>{{ pgettext('firststep', 'Do you want to add a folder now?') }}</p>
  <hr/>

  <p class="text-danger small fw-bold mb-3">{{ pgettext('firststep', 'All the files in this directory would be imported. That can take some time.') }}</p>

  <div class="btn-toolbar mb-3" role="toolbar">
    <div class="input-group">
      <form method="POST" action="{{ url_for('source_create') }}">
        <input type="hidden" name="type" value="local"/>
        <input type="hidden" name="label" value="{{ docs_dir }}"/>
        <input type="hidden" name="path" value="{{ docs_dir }}"/>
        <button type="submit" class="btn btn-primary" title="{{ pgettext('tooltip', 'Import all documents from the %(docs_dir)s folder', docs_dir=docs_dir) }}">🪄 {{ pgettext('firststep', 'Yes, add my <code>%(docs_dir)s</code> folder', docs_dir=docs_dir) }}</button>
      </form>
    </div>
    <div class="btn-group me-2" role="group">
      <a href="{{ url_for('sources_list') }}" class="btn btn-link" id="firststeps_sources_more" title="{{pgettext('tooltip', 'Show all types of data sources you can add')}}">{{ pgettext('firststep', 'More options') }}</a>
    </div>
  </div>
</div>
